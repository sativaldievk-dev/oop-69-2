<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <style>
        body { margin: 0; padding: 32px 18px; font-family: Arial, sans-serif; color: white; background: linear-gradient(135deg, #07172e, #124678); }
        main { max-width: 500px; margin: 8vh auto; padding: 24px; border: 1px solid #ffffff55; border-radius: 18px; background: #dceeff1f; }
        label { display: block; margin: 14px 0 6px; font-weight: bold; }
        input { display: block; width: 100%; padding: 11px; border: 1px solid #ffffff66; border-radius: 9px; font: inherit; }
        button { margin-top: 18px; padding: 10px 15px; border: 1px solid #ffffff66; border-radius: 10px; color: white; background: #ffffff22; cursor: pointer; }
        .errorlist { color: #ffd0d0; }
    </style>
</head>
<body>
<main>
    <h1>Вход</h1>
    {% if form.errors %}<p>Неверное имя пользователя или пароль.</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        {% for field in form %}
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
        {% endfor %}
        <button type="submit">Войти</button>
    </form>
</main>
</body>
</html>
