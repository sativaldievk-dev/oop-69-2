<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Добавить произведение</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px 16px;
            font-family: Arial, sans-serif;
            color: white;
            background:
                linear-gradient(rgba(10,20,40,.35), rgba(10,20,40,.55)),
                url("/static/images/profile.jpg") center / cover fixed;
        }

        .card {
            max-width: 720px;
            margin: 30px auto;
            padding: 30px;
            border: 1px solid rgba(255,255,255,.5);
            border-radius: 24px;
            background: rgba(255,255,255,.16);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 8px 32px rgba(0,0,0,.2);
        }

        h1 { margin-top: 0; }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255,255,255,.6);
            border-radius: 12px;
            font: inherit;
            color: #222;
            background: rgba(255,255,255,.94);
        }

        textarea {
            min-height: 260px;
            resize: vertical;
        }

        .errorlist {
            color: #ffd0d0;
            margin: 6px 0;
            padding-left: 18px;
        }

        button, .back {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 20px;
            border: 0;
            border-radius: 12px;
            background: #fff;
            color: #26334a;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>📚 Новая публикация</h1>
        <p>Добавь название и текст литературного произведения.</p>

        <form method="post">
            {% csrf_token %}

            {% for field in form %}
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {{ field.errors }}
            {% endfor %}

            <button type="submit">Опубликовать</button>
        </form>

        <p><a class="back" href="{% url 'add_category' %}">＋ Создать категорию</a></p>
        <a class="back" href="{% url 'post_list' %}">← К публикациям</a>
    </main>
</body>
</html>
