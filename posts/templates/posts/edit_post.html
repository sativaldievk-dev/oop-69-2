<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактировать публикацию</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 32px 18px; font-family: Arial, sans-serif; color: white; background: linear-gradient(135deg, #07172e, #124678); }
        main { max-width: 760px; margin: auto; padding: 24px; border: 1px solid #ffffff55; border-radius: 18px; background: #dceeff1f; }
        label { display: block; margin: 14px 0 6px; font-weight: bold; }
        input, textarea, select { display: block; width: 100%; padding: 11px; border: 1px solid #ffffff66; border-radius: 9px; font: inherit; }
        textarea { min-height: 180px; }
        button, .button { display: inline-block; margin-top: 16px; padding: 10px 15px; border: 1px solid #ffffff66; border-radius: 10px; color: white; background: #ffffff22; text-decoration: none; cursor: pointer; }
        .errorlist { color: #ffd0d0; }
    </style>
</head>
<body>
<main>
    <h1>Редактировать: {{ post.title }}</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
        {% endfor %}
        <button type="submit">Сохранить изменения</button>
    </form>
    <a class="button" href="{% url 'my_posts' %}">Отмена</a>
</main>
</body>
</html>
