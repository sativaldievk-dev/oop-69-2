<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Удалить публикацию</title>
    <style>
        body { margin: 0; padding: 32px 18px; font-family: Arial, sans-serif; color: white; background: linear-gradient(135deg, #07172e, #124678); }
        main { max-width: 700px; margin: auto; padding: 24px; border: 1px solid #ffffff55; border-radius: 18px; background: #dceeff1f; }
        button, .button { display: inline-block; margin: 10px 8px 0 0; padding: 10px 15px; border: 1px solid #ffffff66; border-radius: 10px; color: white; background: #ffffff22; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <h1>Удалить публикацию?</h1>
    <p>«{{ post.title }}» будет удалена.</p>
    <p>Связанные цитаты сохранятся без привязки к этой публикации.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Удалить</button>
        <a class="button" href="{% url 'my_posts' %}">Отмена</a>
    </form>
</main>
</body>
</html>
