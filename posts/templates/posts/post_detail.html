<h1>{{ post.title }}</h1>

<p>{{ post.description }}</p>

{% if post.is_active %}
    <p>Статус: Active</p>
{% else %}
    <p>Статус: Inactive</p>
{% endif %}

<form method="post" action="{% url 'toggle_active' post.pk %}">
    {% csrf_token %}

    {% if post.is_active %}
        <button type="submit">Сделать Inactive</button>
    {% else %}
        <button type="submit">Сделать Active</button>
    {% endif %}
</form>
