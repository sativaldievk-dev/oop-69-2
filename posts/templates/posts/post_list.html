<h1>Список постов</h1>

{% for post in posts %}
    <div>
        <h2>
            <a href="{% url 'post_detail' post.pk %}">
                {{ post.title }}
            </a>
        </h2>

        {% if post.is_active %}
            <p>Статус: Active</p>
        {% else %}
            <p>Статус: Inactive</p>
        {% endif %}
    </div>
{% empty %}
    <p>Пока нет постов.</p>
{% endfor %}
