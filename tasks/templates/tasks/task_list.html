<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список задач</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 32px 16px;
            color: #1e293b;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .panel {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            padding: 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        h1 {
            margin: 0;
            font-size: 2rem;
        }
        .btn {
            display: inline-block;
            text-decoration: none;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s ease;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #0f172a;
        }
        .task-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 18px 20px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            margin-bottom: 16px;
            background: #f8fafc;
        }
        .task-meta {
            flex: 1;
        }
        .task-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0 0 8px;
        }
        .task-title a {
            color: #0f172a;
            text-decoration: none;
        }
        .task-title a:hover {
            color: #2563eb;
        }
        .status {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 999px;
        }
        .status-done {
            background: #dcfce7;
            color: #166534;
        }
        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }
        .task-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        form {
            margin: 0;
        }
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: #64748b;
        }
        @media (max-width: 640px) {
            .task-card {
                flex-direction: column;
                align-items: flex-start;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Список задач</h1>
            <a href="{% url 'tasks:task_create' %}" class="btn btn-primary">+ Добавить задачу</a>
        </div>

        <div class="panel">
            {% if tasks %}
                {% for task in tasks %}
                    <div class="task-card">
                        <div class="task-meta">
                            <div class="task-title">
                                <a href="{% url 'tasks:task_detail' task.pk %}">{{ task.title }}</a>
                            </div>
                            <div>
                                <span class="status {% if task.completed %}status-done{% else %}status-pending{% endif %}">
                                    {% if task.completed %}Выполнено{% else %}Не выполнено{% endif %}
                                </span>
                            </div>
                        </div>

                        <div class="task-actions">
                            <a href="{% url 'tasks:task_detail' task.pk %}" class="btn btn-secondary">Подробнее</a>
                            <form method="post" action="{% url 'tasks:task_toggle' task.pk %}">
                                {% csrf_token %}
                                <input type="hidden" name="next" value="{% url 'tasks:task_list' %}">
                                <button type="submit" class="btn btn-secondary">
                                    {% if task.completed %}Отметить как не выполнено{% else %}Отметить как выполнено{% endif %}
                                </button>
                            </form>
                        </div>
                    </div>
                {% endfor %}
            {% else %}
                <div class="empty-state">
                    Пока задач нет. Создайте первую задачу.
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
