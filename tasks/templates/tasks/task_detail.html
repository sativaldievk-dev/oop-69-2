<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ task.title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 32px 16px;
            color: #1e293b;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
        }
        .panel {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            padding: 28px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
        }
        h1 {
            margin: 0;
            font-size: 2rem;
        }
        .status {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.8rem;
        }
        .status-done {
            background: #dcfce7;
            color: #166534;
        }
        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }
        .meta {
            color: #64748b;
            font-size: 0.95rem;
            margin: 14px 0;
        }
        .description {
            background: #f8fafc;
            border-radius: 12px;
            padding: 18px;
            line-height: 1.6;
            min-height: 120px;
            white-space: pre-wrap;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }
        .btn {
            display: inline-block;
            text-decoration: none;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #0f172a;
        }
        form {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <h1>{{ task.title }}</h1>
            <span class="status {% if task.completed %}status-done{% else %}status-pending{% endif %}">
                {% if task.completed %}Выполнено{% else %}Не выполнено{% endif %}
            </span>
        </div>

        <div class="panel">
            <div class="meta">
                <strong>Дата создания:</strong> {{ task.created_at|date:"d.m.Y H:i" }}
            </div>

            <div class="description">
                {% if task.description %}
                    {{ task.description }}
                {% else %}
                    Описание отсутствует.
                {% endif %}
            </div>

            <div class="actions">
                <a href="{% url 'tasks:task_list' %}" class="btn btn-secondary">Назад к списку</a>
                <form method="post" action="{% url 'tasks:task_toggle' task.pk %}">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{% url 'tasks:task_detail' task.pk %}">
                    <button type="submit" class="btn btn-primary">
                        {% if task.completed %}Отметить как не выполнено{% else %}Отметить как выполнено{% endif %}
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
